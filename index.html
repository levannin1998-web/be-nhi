<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mãi Yêu Bé Nhi</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(#ffd6e7,#fff);display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:white;padding:20px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center;max-width:380px}
img{width:100%;border-radius:16px}
h1{color:#ff4f8b} p{font-size:22px;color:#ff4f8b;font-weight:bold}
.heart{position:fixed;top:-20px;color:#ff4f8b;animation:fall 6s linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
</style></head><body>
<div class="card">
<h1>💖 Mãi Yêu Bé Nhi 💖</h1>
<p>cute phô mai que</p>
<img src="be-nhi.jpg">
</div>
<script>
for(let i=0;i<30;i++){let h=document.createElement('div');h.className='heart';h.innerHTML='❤';h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*6+'s';document.body.appendChild(h);}
</script>
</body></html>
